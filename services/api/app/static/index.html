<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotMap — карта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-name">SpotMap</p>
          <p class="brand-sub">wakesurf · wakeboard cable · Russia</p>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Фильтры дисциплин">
        <button type="button" class="chip active" data-discipline="">Все P0</button>
        <button type="button" class="chip" data-discipline="wakesurf">Wakesurf</button>
        <button type="button" class="chip" data-discipline="wakeboard_cable">Электротяга</button>
      </div>
      <div id="statusPill" class="status-pill">загрузка…</div>
    </header>

    <aside class="panel">
      <section class="panel-block">
        <h1>Карта</h1>
        <p class="lede">Публичные пины только после геопроверки. Staging не рисуется как факты.</p>
        <div id="stats" class="stats"></div>
      </section>

      <section class="panel-block">
        <div class="panel-head">
          <h2>Очередь staging</h2>
          <select id="kindFilter" aria-label="Тип кандидата">
            <option value="">все типы</option>
            <option value="spot_or_club">spot/club</option>
            <option value="cable_installation">cable</option>
            <option value="other">other</option>
          </select>
        </div>
        <ul id="queue" class="queue"></ul>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map" role="application" aria-label="Карта спотов SpotMap"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p class="empty-title">Пока нет проверенных точек</p>
        <p class="empty-text">Кандидаты есть в staging, но без verified-координат карта остаётся пустой — это правильно.</p>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
